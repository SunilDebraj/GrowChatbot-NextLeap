[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mf-facts-bot"
version = "0.1.0"
description = "Mutual fund facts-only Q&A assistant (RAG chatbot)"
requires-python = ">=3.10"
dependencies = [
    "chromadb>=1.5",
    "sentence-transformers>=6",
    "pypdf>=4",
    "beautifulsoup4>=4.12",
    "lxml>=5",
    "pyyaml>=6",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
]
# P5 serves api/app.py, which is hand-rolled ASGI: uvicorn is the only thing
# needed to run it. Kept out of the main dependencies so importing the app, and
# the whole test suite, works without an ASGI server installed.
serve = [
    "uvicorn>=0.30",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# "src" for mf_facts, "." for the top-level api/ package. Declared so the suite
# runs the same whether or not the project has been pip-installed.
pythonpath = ["src", "."]
markers = [
    "contract: structural promises (metadata completeness, idempotency, integrity)",
    "adversarial: safety eval sets (PII, refusal, performance, out-of-scope)",
]
filterwarnings = ["ignore::DeprecationWarning"]
