# Source registry (architecture.md section 5.1, PRD.md section 5.1/5.2).
#
# ONE SPEC PER (scheme_key, doc_class). Multiple specs MAY share one url with a
# different locator: the page is fetched once through the content-addressed cache
# and then parsed once per spec, so a single scheme page yields several document
# classes. This is the structural rule called out in implementation.md section 5.0.
#
# All page-structure assumptions live in this file. No selector or label is
# hardcoded in parser code (rule GR12).
#
# LOCATOR GRAMMAR (parts joined by ";"), evaluated in order and concatenated:
#   full                      the whole cleaned document
#   css:<selector>            first matching element
#   heading:<exact text>      the section from that heading to the next heading
#                             of the same or a higher level
#   labels:<L1>|<L2>          "L: value" for each label, taking the element's
#                             next sibling as the value
#   pill:<exact text>         "Riskometer: <text>" for a label-less header chip
#
# WHY: hdfcmutualfund.com returns HTTP 403 and sebi.gov.in times out, so no
# AMC-hosted copy is reachable. Groww republishes AMC-published scheme data, which
# PRD.md section 5.3 permits for this milestone, but it means these are
# aggregator-hosted republishing rather than primary AMC documents. Recorded in
# sources.csv so the provenance is visible in the artifact.

defaults:
  publisher: aggregator
  effective_date: null
  last_updated: null

schemes:
  - scheme_key: hdfc_large_cap_direct_growth
    scheme_name: HDFC Large Cap Fund - Direct Growth
    url: https://groww.in/mutual-funds/hdfc-large-cap-fund-direct-growth
    specs:
      - {source_id: lc_overview,     doc_class: overview,     locator: "css:header;labels:Fund benchmark|Fund size (AUM)|NAV:|Min. for SIP|Min. for 1st investment|Min. for 2nd investment"}
      - {source_id: lc_fees,         doc_class: fees,         locator: "labels:Expense ratio;heading:Exit load, stamp duty and tax"}
      - source_id: lc_faq
        doc_class: faq
        enabled: false
        reason: >-
          Groww renders the FAQ accordion client-side. The static HTML
          contains no question/answer pairs, so any locator would return
          navigation chrome rather than FAQ content. See
          docs/corpus_gaps.md.
      - {source_id: lc_riskometer,   doc_class: riskometer,   locator: "pill:Very High Risk;pill:High Risk;pill:Moderate Risk;pill:Low Risk;pill:Very Low Risk"}

  - scheme_key: hdfc_equity_flexi_cap_direct_growth
