# ---------------------------------------------------------------------------
# DOCUMENT CLASSES THAT COULD NOT BE SOURCED.
#
# Recorded as disabled specs with the reason, so sources.csv and the manifest
# state the corpus gap instead of silently omitting it. This is the
# implementation.md section 2.1 STOP condition: "doc classes must be
# renegotiated". Reachable coverage is 3 of 8 doc classes (overview, fees,
# riskometer). faq is reachable by URL but its content is client-rendered, so
# its five specs are disabled above rather than returning navigation chrome.
#
#   faq             NO CONTENT  groww.in scheme pages return 200 and the spec is
#                              enabled in the registry, but the accordion is
#                              rendered client-side. The static HTML holds no
#                              question/answer pairs, only nav labels, so the
#                              specs are disabled with a reason.
#   factsheet       NOT FOUND  hdfcfund.com 403; amfiindia.com document
#                              endpoints 404; factsheet links not present in
#                              server-rendered HTML.
#   kim             NOT FOUND  same as above (KIM is distributed as a PDF from
#                              the AMC site).
#   sid             NOT FOUND  same as above.
#   statement_guide NOT FOUND  groww.in/help/* returns 200 but the article body
#                              is client-side rendered; only "Customer Support"
#                              is present in the HTML.
#
# CONSEQUENCE FOR PRD.md SECTION 5.2: expense ratio, exit load, minimum SIP,
# riskometer and benchmark are answerable from the corpus, and so is the ELSS
# lock-in period: the ELSS header renders the chip "ELSS - 3Y Lock-in", which the
# css:header locator picks up. An earlier revision of this file claimed the
# lock-in was missing; that search covered the body copy only, not the header.
#
# Capital-gains statement download is NOT present in any reachable page. The
# grounding check refuses that question rather than answering from model memory,
# which is the designed safe behaviour, but it cannot be demonstrated until a
# source is added. See docs/corpus_gaps.md.
# ---------------------------------------------------------------------------
unavailable:
  - doc_class: factsheet
    reason: "hdfcfund.com 403; amfiindia.com document endpoints 404"
  - doc_class: kim
    reason: "KIM PDFs are only distributed from the AMC site, which returns 403"
  - doc_class: sid
    reason: "SID PDFs are only distributed from the AMC site, which returns 403"
  - doc_class: statement_guide
    reason: "groww.in/help/* article bodies are client-side rendered; no text in HTML"
